name: Android Debug Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify libxposed metadata in APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "META-INF/xposed/java_init.list"
          unzip -p "$APK" "META-INF/xposed/java_init.list" | grep -Fx "dev.wua1331.neteaseqqregisterhelper.ModuleEntry"
          unzip -p "$APK" "META-INF/xposed/module.prop" | grep -Fx "minApiVersion=102"
          unzip -p "$APK" "META-INF/xposed/module.prop" | grep -Fx "exceptionMode=protective"
          unzip -p "$APK" "META-INF/xposed/scope.list" | grep -Fx "com.netease.cloudmusic"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NeteaseQQRegisterHelper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
